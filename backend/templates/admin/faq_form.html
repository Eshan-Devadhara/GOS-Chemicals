{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if faq else 'New' }} FAQ{% endblock %}
{% block content %}
<div class="admin-header">
    <h1>{{ 'Edit' if faq else 'New' }} FAQ</h1>
    <a href="{{ url_for('admin.faqs_list') }}" class="btn btn-primary">← Back</a>
</div>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="question">Question</label>
            <input type="text" id="question" name="question" value="{{ faq.question if faq else '' }}" required>
        </div>
        <div class="form-group">
            <label for="answer">Answer</label>
            <textarea id="answer" name="answer" rows="5" required>{{ faq.answer if faq else '' }}</textarea>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 1.5rem;">
            <div class="form-group">
                <label for="display_order">Display Order</label>
                <input type="number" id="display_order" name="display_order" value="{{ faq.display_order if faq else 0 }}">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="published" {{ 'selected' if faq and faq.status == 'published' }}>Published</option>
                    <option value="draft" {{ 'selected' if faq and faq.status == 'draft' }}>Draft</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">{{ 'Update' if faq else 'Create' }}</button>
    </form>
</div>
{% endblock %}
