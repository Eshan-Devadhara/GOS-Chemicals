{% extends "admin/base.html" %}
{% block title %}FAQs{% endblock %}
{% block content %}
<div class="admin-header">
    <h1>FAQs</h1>
    <a href="{{ url_for('admin.faq_new') }}" class="btn btn-primary">+ Add New</a>
</div>
<table>
    <thead><tr><th>Order</th><th>Question</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
    {% for f in faqs %}
    <tr>
        <td>{{ f.display_order }}</td>
        <td>{{ f.question }}</td>
        <td>{{ f.status }}</td>
        <td>
            <a href="{{ url_for('admin.faq_edit', id=f.id) }}" class="btn btn-primary btn-sm">Edit</a>
            <form method="POST" action="{{ url_for('admin.faq_delete', id=f.id) }}" style="display:inline" onsubmit="return confirm('Delete?')">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% if not faqs %}<p style="padding:1rem; color:var(--admin-text-muted);">No FAQs yet.</p>{% endif %}
{% endblock %}
