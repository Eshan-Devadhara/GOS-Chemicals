{% extends "admin/base.html" %}
{% block title %}Custom Categories{% endblock %}
{% block content %}
<div class="admin-header">
    <h1>Custom Manufacturing Categories</h1>
</div>
<div class="card">
    <form method="POST" class="inline-form" style="margin-bottom:1.5rem;">
        <input type="hidden" name="action" value="add">
        <div class="form-group" style="flex:1; margin-bottom:0;">
            <input type="text" name="name" placeholder="Category name" required>
        </div>
        <div class="form-group" style="width:100px; margin-bottom:0;">
            <input type="number" name="display_order" placeholder="Order" value="0">
        </div>
        <button type="submit" class="btn btn-primary">Add</button>
    </form>
    <table>
        <thead><tr><th>Order</th><th>Name</th><th>Actions</th></tr></thead>
        <tbody>
        {% for c in categories %}
        <tr>
            <td>{{ c.display_order }}</td>
            <td>{{ c.name }}</td>
            <td>
                <form method="POST" style="display:inline" onsubmit="return confirm('Delete?')">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="id" value="{{ c.id }}">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% if not categories %}<p style="padding:1rem; color:var(--admin-text-muted);">No categories yet.</p>{% endif %}
</div>
{% endblock %}
